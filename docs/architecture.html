<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Discovery · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f8fafc;
      --color-ink:     #0f172a;
      --color-muted:   #3d4a5e;
      --color-soft:    #515f74;
      --color-accent:  #2563eb;
      --font-sans:     'DM Sans', system-ui, sans-serif;
      --font-mono:     'DM Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1320px; width: 100%; min-width: 0; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 60ch;
    }

    svg { width: 100%; min-width: 1280px; display: block; }

    svg .nm { font-family: var(--font-sans); font-size: 12px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
    svg .sb { font-family: var(--font-mono); font-size: 9px; fill: #3d4a5e; text-anchor: middle; }
    svg .tg { font-family: var(--font-mono); font-size: 7px; letter-spacing: 0.08em; text-anchor: middle; }
    svg .al { font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.06em; fill: #3d4a5e; text-anchor: middle; }
    svg .zl { font-family: var(--font-mono); font-size: 8px; font-weight: 500; letter-spacing: 0.14em; fill: #515f74; text-anchor: middle; }
    svg .co { font-family: var(--font-sans); font-size: 14px; font-style: italic; fill: #0f172a; }
    svg .lg { font-family: var(--font-sans); font-size: 9px; fill: #3d4a5e; }
    svg .lh { font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.18em; fill: #3d4a5e; }

    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Site Discovery</p>
    <h1>Site Discovery architecture</h1>
    <p class="subtitle">One local Bun process owns every run and all state. The browser only polls it, so closing the tab never cancels work.</p>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
        <title id="architecture-title">Site Discovery architecture</title>
        <desc id="architecture-desc">Architecture of the Site Discovery app: a browser UI calls an owner-gated local Bun service whose durable discovery engine commits state to SQLite and screenshot files before calling Cloudflare Browser Run, the target websites, and Claude through Cloudflare AI Gateway.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3d4a5e"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1e40af"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f8fafc"/>

        <!-- ============ Zones (drawn first) ============ -->
        <!-- Bun service -->
        <rect x="232" y="216" width="760" height="128" rx="8" fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.10)" stroke-width="0.8"/>
        <rect x="244" y="220" width="180" height="12" rx="2" fill="#f8fafc"/>
        <text x="334" y="229" class="zl">BUN SERVICE · 127.0.0.1:3193</text>

        <!-- Local state -->
        <rect x="352" y="408" width="400" height="128" rx="8" fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.10)" stroke-width="0.8"/>
        <rect x="364" y="412" width="192" height="12" rx="2" fill="#f8fafc"/>
        <text x="460" y="421" class="zl">LOCAL STATE · .local/discovery</text>

        <!-- Remote -->
        <rect x="1012" y="64" width="228" height="472" rx="8" fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.10)" stroke-width="0.8"/>
        <rect x="1024" y="68" width="156" height="12" rx="2" fill="#f8fafc"/>
        <text x="1102" y="77" class="zl">REMOTE · PUBLIC INTERNET</text>

        <!-- ============ Arrows (behind nodes) ============ -->
        <!-- UI → Owner Gate -->
        <line x1="200" y1="280" x2="264" y2="280" stroke="#3d4a5e" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Owner Gate → Engine -->
        <line x1="424" y1="280" x2="496" y2="280" stroke="#3d4a5e" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Engine → Outbound Adapters -->
        <line x1="736" y1="280" x2="800" y2="280" stroke="#3d4a5e" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Engine → harness.sqlite (headline: commit before any outbound call) -->
        <line x1="656" y1="312" x2="656" y2="440" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- Engine → Screenshots: leave bottom edge, enter right edge -->
        <path d="M 576,312 V 464 Q 576,472 568,472 H 544" fill="none" stroke="#3d4a5e" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Adapters → Target Websites: leave top edge, enter left edge -->
        <path d="M 880,248 V 136 Q 880,128 888,128 H 1036" fill="none" stroke="#3d4a5e" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Adapters → Browser Run -->
        <line x1="960" y1="280" x2="1036" y2="280" stroke="#3d4a5e" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Adapters → AI Gateway: leave bottom edge, enter left edge -->
        <path d="M 880,312 V 464 Q 880,472 888,472 H 1036" fill="none" stroke="#3d4a5e" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Browser Run → Target Websites (remote render, passive) -->
        <line x1="1126" y1="248" x2="1126" y2="160" stroke="#3d4a5e" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- ============ Arrow labels (masked, 6–10px off the stroke) ============ -->
        <rect x="204" y="260" width="56" height="12" rx="2" fill="#f8fafc"/>
        <text x="232" y="269" class="al">POST /RPC</text>

        <rect x="430" y="260" width="60" height="12" rx="2" fill="#f8fafc"/>
        <text x="460" y="269" class="al">13 RPC OPS</text>

        <rect x="664" y="366" width="40" height="12" rx="2" fill="#f8fafc"/>
        <text x="684" y="375" class="al" style="fill:#2563eb">COMMIT</text>

        <rect x="512" y="366" width="56" height="12" rx="2" fill="#f8fafc"/>
        <text x="540" y="375" class="al">WRITE PNG</text>

        <rect x="938" y="108" width="48" height="12" rx="2" fill="#f8fafc"/>
        <text x="962" y="117" class="al">DISCOVER</text>

        <rect x="974" y="260" width="48" height="12" rx="2" fill="#f8fafc"/>
        <text x="998" y="269" class="al">SNAPSHOT</text>

        <rect x="940" y="452" width="44" height="12" rx="2" fill="#f8fafc"/>
        <text x="962" y="461" class="al">ANALYZE</text>

        <rect x="1134" y="198" width="40" height="12" rx="2" fill="#f8fafc"/>
        <text x="1154" y="207" class="al">RENDER</text>

        <!-- ============ Nodes ============ -->
        <!-- Discovery UI (input) -->
        <rect x="40" y="248" width="160" height="64" rx="6" fill="#f8fafc"/>
        <rect x="40" y="248" width="160" height="64" rx="6" fill="rgba(61,74,94,0.10)" stroke="#515f74" stroke-width="1"/>
        <rect x="48" y="256" width="24" height="12" rx="2" fill="none" stroke="rgba(81,95,116,0.50)" stroke-width="0.8"/>
        <text x="60" y="265" class="tg" fill="#515f74">UI</text>
        <text x="120" y="284" class="nm">Discovery UI</text>
        <text x="120" y="300" class="sb">Foldkit · polls 2s</text>

        <!-- Owner Gate (security) -->
        <rect x="264" y="248" width="160" height="64" rx="6" fill="#f8fafc"/>
        <rect x="264" y="248" width="160" height="64" rx="6" fill="rgba(37,99,235,0.05)" stroke="rgba(37,99,235,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
        <rect x="272" y="256" width="28" height="12" rx="2" fill="none" stroke="rgba(37,99,235,0.40)" stroke-width="0.8"/>
        <text x="286" y="265" class="tg" fill="#2563eb">AUTH</text>
        <text x="344" y="284" class="nm">Owner Gate</text>
        <text x="344" y="300" class="sb">origin · session cookie</text>

        <!-- Discovery Engine (focal) -->
        <rect x="496" y="248" width="240" height="64" rx="6" fill="#f8fafc"/>
        <rect x="496" y="248" width="240" height="64" rx="6" fill="rgba(37,99,235,0.08)" stroke="#2563eb" stroke-width="1.2"/>
        <rect x="504" y="256" width="28" height="12" rx="2" fill="none" stroke="rgba(37,99,235,0.50)" stroke-width="0.8"/>
        <text x="518" y="265" class="tg" fill="#2563eb">CORE</text>
        <text x="616" y="284" class="nm">Discovery Engine</text>
        <text x="616" y="300" class="sb">pi-durable · discovery.work</text>

        <!-- Outbound Adapters (backend) -->
        <rect x="800" y="248" width="160" height="64" rx="6" fill="#f8fafc"/>
        <rect x="800" y="248" width="160" height="64" rx="6" fill="#fdfeff" stroke="#0f172a" stroke-width="1"/>
        <rect x="808" y="256" width="24" height="12" rx="2" fill="none" stroke="rgba(15,23,42,0.40)" stroke-width="0.8"/>
        <text x="820" y="265" class="tg" fill="#0f172a">OUT</text>
        <text x="880" y="284" class="nm">Outbound Adapters</text>
        <text x="880" y="300" class="sb">providers.ts · urls.ts</text>

        <!-- Screenshots (store) -->
        <rect x="384" y="440" width="160" height="64" rx="6" fill="#f8fafc"/>
        <rect x="384" y="440" width="160" height="64" rx="6" fill="rgba(15,23,42,0.05)" stroke="#3d4a5e" stroke-width="1"/>
        <rect x="392" y="448" width="24" height="12" rx="2" fill="none" stroke="rgba(61,74,94,0.50)" stroke-width="0.8"/>
        <text x="404" y="457" class="tg" fill="#3d4a5e">FS</text>
        <text x="464" y="476" class="nm">Screenshots</text>
        <text x="464" y="492" class="sb">{uuid}.png · mode 0600</text>

        <!-- harness.sqlite (store) -->
        <rect x="592" y="440" width="128" height="64" rx="6" fill="#f8fafc"/>
        <rect x="592" y="440" width="128" height="64" rx="6" fill="rgba(15,23,42,0.05)" stroke="#3d4a5e" stroke-width="1"/>
        <rect x="600" y="448" width="24" height="12" rx="2" fill="none" stroke="rgba(61,74,94,0.50)" stroke-width="0.8"/>
        <text x="612" y="457" class="tg" fill="#3d4a5e">DB</text>
        <text x="656" y="476" class="nm">harness.sqlite</text>
        <text x="656" y="492" class="sb">WAL · sync FULL</text>

        <!-- Target Websites (external) -->
        <rect x="1036" y="96" width="180" height="64" rx="6" fill="#f8fafc"/>
        <rect x="1036" y="96" width="180" height="64" rx="6" fill="rgba(15,23,42,0.03)" stroke="rgba(15,23,42,0.30)" stroke-width="1"/>
        <rect x="1044" y="104" width="28" height="12" rx="2" fill="none" stroke="rgba(15,23,42,0.22)" stroke-width="0.8"/>
        <text x="1058" y="113" class="tg" fill="#515f74">WEB</text>
        <text x="1126" y="132" class="nm">Target Websites</text>
        <text x="1126" y="148" class="sb">robots · sitemap · HTML</text>

        <!-- Browser Run (external) -->
        <rect x="1036" y="248" width="180" height="64" rx="6" fill="#f8fafc"/>
        <rect x="1036" y="248" width="180" height="64" rx="6" fill="rgba(15,23,42,0.03)" stroke="rgba(15,23,42,0.30)" stroke-width="1"/>
        <rect x="1044" y="256" width="24" height="12" rx="2" fill="none" stroke="rgba(15,23,42,0.22)" stroke-width="0.8"/>
        <text x="1056" y="265" class="tg" fill="#515f74">CF</text>
        <text x="1126" y="284" class="nm">Browser Run</text>
        <text x="1126" y="300" class="sb">/browser-run/snapshot</text>

        <!-- AI Gateway → Claude (external) -->
        <rect x="1036" y="440" width="180" height="64" rx="6" fill="#f8fafc"/>
        <rect x="1036" y="440" width="180" height="64" rx="6" fill="rgba(15,23,42,0.03)" stroke="rgba(15,23,42,0.30)" stroke-width="1"/>
        <rect x="1044" y="448" width="28" height="12" rx="2" fill="none" stroke="rgba(15,23,42,0.22)" stroke-width="0.8"/>
        <text x="1058" y="457" class="tg" fill="#515f74">LLM</text>
        <text x="1126" y="476" class="nm">AI Gateway → Claude</text>
        <text x="1126" y="492" class="sb">gateway.ai.cloudflare.com</text>

        <!-- ============ Callouts (margins, max 2) ============ -->
        <text x="264" y="128" class="co">Each attempt and its budget reservation commit</text>
        <text x="264" y="148" class="co">before any outbound call. A crash leaves the run</text>
        <text x="264" y="168" class="co">in requires retry; nothing is silently resent.</text>
        <path d="M 600,180 Q 612,212 616,246" fill="none" stroke="rgba(15,23,42,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="616" cy="248" r="2" fill="#0f172a"/>

        <text x="1240" y="576" class="co" text-anchor="end">Capture never calls Claude. Only Analyze does,</text>
        <text x="1240" y="596" class="co" text-anchor="end">each attempt reserved against USD limits.</text>
        <path d="M 1104,558 Q 1112,528 1124,506" fill="none" stroke="rgba(15,23,42,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="1126" cy="504" r="2" fill="#0f172a"/>

        <!-- ============ Legend strip ============ -->
        <line x1="40" y1="636" x2="1240" y2="636" stroke="rgba(15,23,42,0.10)" stroke-width="0.8"/>
        <text x="40" y="656" class="lh">LEGEND</text>

        <rect x="40" y="672" width="14" height="10" rx="2" fill="rgba(37,99,235,0.08)" stroke="#2563eb" stroke-width="1"/>
        <text x="60" y="680" class="lg">Focal core</text>

        <rect x="148" y="672" width="14" height="10" rx="2" fill="rgba(37,99,235,0.05)" stroke="rgba(37,99,235,0.50)" stroke-width="1" stroke-dasharray="3,2"/>
        <text x="168" y="680" class="lg">Security gate</text>

        <rect x="264" y="672" width="14" height="10" rx="2" fill="#fdfeff" stroke="#0f172a" stroke-width="1"/>
        <text x="284" y="680" class="lg">Service module</text>

        <rect x="384" y="672" width="14" height="10" rx="2" fill="rgba(15,23,42,0.05)" stroke="#3d4a5e" stroke-width="1"/>
        <text x="404" y="680" class="lg">Local store</text>

        <rect x="484" y="672" width="14" height="10" rx="2" fill="rgba(15,23,42,0.03)" stroke="rgba(15,23,42,0.30)" stroke-width="1"/>
        <text x="504" y="680" class="lg">Remote service</text>

        <rect x="604" y="672" width="14" height="10" rx="2" fill="rgba(61,74,94,0.10)" stroke="#515f74" stroke-width="1"/>
        <text x="624" y="680" class="lg">Browser UI</text>

        <line x1="716" y1="677" x2="744" y2="677" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="752" y="680" class="lg">Durable commit</text>

        <line x1="852" y1="677" x2="880" y2="677" stroke="#3d4a5e" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="888" y="680" class="lg">Call</text>

        <line x1="940" y1="677" x2="968" y2="677" stroke="#3d4a5e" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="976" y="680" class="lg">Remote fetch (passive)</text>
      </svg>
    </div>
  </div>
</body>
</html>
